name: Near Miss MFE MAE Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '0 23 * * *'

permissions:
  contents: write

concurrency:
  group: paribu-momentum-watcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process mature near misses
        env:
          SHADOW_MODE: 'true'
        run: python check_near_misses.py

      - name: Persist near-miss state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scanner_state.json
          if [ -f near_misses_archive.jsonl ]; then
            git add near_misses_archive.jsonl
          fi

          if git diff --cached --quiet; then
            echo "No near-miss state changes."
            exit 0
          fi

          git commit -m "Update near miss calibration state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
