name: Paribu Momentum Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches:
      - main
      - 'feat/**'
    paths-ignore:
      - scanner_state.json

permissions:
  contents: write

concurrency:
  group: paribu-momentum-watcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate signal lifecycle
        run: python -m pytest -q

      - name: Run scanner
        if: github.ref == 'refs/heads/main'
        env:
          SHADOW_MODE: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_AI_MANAGER_TEST: ${{ vars.RUN_AI_MANAGER_TEST || 'false' }}
        run: python main.py

      - name: Persist scanner state
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          if [ ! -f scanner_state.json ]; then
            echo "scanner_state.json was not created; nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scanner_state.json

          if git diff --cached --quiet; then
            echo "No scanner state changes."
            exit 0
          fi

          git commit -m "Update scanner state [skip ci]"

          persisted=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              persisted=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done

          if [ "$persisted" -ne 1 ]; then
            echo "Failed to persist state after 3 retries"
            exit 1
          fi
