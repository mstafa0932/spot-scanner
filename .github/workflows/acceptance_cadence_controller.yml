name: Cadence Controller

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/acceptance_cadence_controller.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: paribu-cadence-controller
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Dispatch scanner every 10 minutes for 4 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "[CADENCE] controller_started_at=$(date -u +%FT%TZ)"
          echo "[CADENCE] planned_dispatches=24 interval_seconds=600"

          for i in $(seq 1 24); do
            sleep 600
            dispatched_at=$(date -u +%FT%TZ)

            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/scanner.yml/dispatches" \
              --data '{"ref":"main"}'

            echo "[CADENCE] dispatch=${i}/24 at=${dispatched_at}"
          done

          echo "[CADENCE] chaining_successor_at=$(date -u +%FT%TZ)"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/acceptance_cadence_controller.yml/dispatches" \
            --data '{"ref":"main"}'

          echo "[CADENCE] controller_finished_at=$(date -u +%FT%TZ)"
