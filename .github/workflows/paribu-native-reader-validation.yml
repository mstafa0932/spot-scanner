name: XCN original closed-candle follow-up evidence

on:
  push:
    branches: ['diagnostic/radar-cases-20261017']
    paths: ['.github/workflows/paribu-native-reader-validation.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHADOW_MODE: 'true'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf5ef221abd983dc4384853ea1ca77824e4a2dc0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public reader dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'requests>=2.32,<3'
      - name: Collect original closed XCN candles for as-of audit
        shell: python
        run: |
          import base64, hashlib, json, os, time, zlib
          from unittest.mock import patch
          import market_data as md
          from candle_backfill import bind_history
          
          assert os.environ["SHADOW_MODE"].lower()=="true"
          print("MODE finite_public_original_candles no_scanner no_orders no_messages")
          original=md._request_backfill_json
          captures=[]
          def capture(params, *, url=md.PARIBU_CHART_HISTORY_URL):
              assert url==md.PARIBU_NATIVE_OHLC_URL and params["symbol"]=="xcn_tl"
              assert len(captures)<8
              payload=original(params,url=url)
              row={"endpoint":url,"params":params,"retrieved_at":int(time.time()),"payload":payload}
              raw=json.dumps(row,separators=(",",":"),ensure_ascii=False).encode()
              print("XCN_CAPTURE",json.dumps({"index":len(captures),"sha256":hashlib.sha256(raw).hexdigest(),"encoding":"base64_zlib_json","data":base64.b64encode(zlib.compress(raw)).decode()},separators=(",",":")),flush=True)
              captures.append(row)
              return payload
          with patch.object(md,"_request_backfill_json",capture):
              for interval,limit in (("15m",500),("1h",250),("4h",250)):
                  bind_history({})
                  frame=md.fetch_candles("XCN_TL",interval,limit)
                  seconds=md._interval_config(interval)[1]
                  assert frame.is_authentic.all()
                  assert frame.attrs["candle_quality"]["synthetic_count"]==0
                  assert (frame.timestamp+seconds<=int(time.time())).all()
                  assert frame.timestamp.diff().iloc[1:].eq(seconds).all()
                  print("XCN_CLOSED_FOLLOWUP",json.dumps({"interval":interval,"count":len(frame),"latest_open":int(frame.timestamp.iloc[-1]),"latest_close":int(frame.timestamp.iloc[-1])+seconds,"local_synthetic":0,"published_zero_volume":int(frame.volume.eq(0).sum()),"source":frame.attrs["candle_endpoint"]},separators=(",",":")),flush=True)
                  time.sleep(.3)
          print("FINITE_XCN_ORIGINAL_CAPTURE_COMPLETE",len(captures),"not_a_scanner_or_monitor")
