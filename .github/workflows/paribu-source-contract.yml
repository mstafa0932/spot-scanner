name: Read public Paribu source contract

on:
  push:
    branches: ['diagnostic/radar-cases-20261017']
    paths: ['.github/workflows/paribu-source-contract.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHADOW_MODE: 'true'
    steps:
      - name: Inspect public docs and directly referenced public assets
        shell: python
        run: |
          import hashlib, json, re, time
          import urllib.error, urllib.parse, urllib.request

          # Finite public GETs only. No scanner, credentials, orders, or messages.
          calls = 0
          blocked = False
          headers = {'User-Agent': 'Mozilla/5.0', 'Accept': '*/*'}
          allowed = {'www.paribu.com', 'web.paribu.com', 'docs.paribu.com', 'static.paribu.com'}
          def read(url):
              global calls, blocked
              if blocked or calls >= 12:
                  return ''
              if urllib.parse.urlparse(url).hostname not in allowed:
                  return ''
              calls += 1
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as response:
                      body = response.read(3_000_001)
                      status = response.status
                  if len(body) > 3_000_000:
                      raise ValueError('Response exceeds limit')
                  value = body.decode('utf-8', 'replace')
                  print('SOURCE', json.dumps({'url': url, 'status': status, 'bytes': len(body),
                        'sha256': hashlib.sha256(body).hexdigest()}))
                  return value
              except urllib.error.HTTPError as exc:
                  blocked = exc.code == 429
                  print('SOURCE_ERROR', json.dumps({'url': url, 'status': exc.code}))
              except Exception as exc:
                  print('SOURCE_ERROR', json.dumps({'url': url, 'type': type(exc).__name__}))
              return ''

          url = 'https://www.paribu.com'
          body = read(url)
          for pattern in ('window.__ENV__', '__PARIBU_RUNTIME__', 'NUXT_API_BASE_URL', 'apiBaseUrl'):
              at = body.find(pattern)
              if at >= 0:
                  print('RUNTIME_CONTRACT', json.dumps({'pattern': pattern, 'content': body[max(0, at-150):at+1000]}))
          body = read('https://www.paribu.com/_app/index-J3LAJMOg.js')
          for pattern in ('pairKey:', 'pairKey=', 'marketType:"crypto"', 'const CHART_'):
              matches = []
              for match in re.finditer(re.escape(pattern), body):
                  matches.append(body[max(0, match.start()-300):match.end()+450])
                  if len(matches) >= 5:
                      break
              print('PAIR_CONTRACT', json.dumps({'pattern': pattern, 'matches': matches}))
          print('PUBLIC_SOURCE_INSPECTION_FINISHED', calls)
